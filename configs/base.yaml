project:
  name: opd-lab
  seed: 42
  seed_policy: single
  registered_seeds: [42]
  gpu_hour_target: 90
  gpu_hour_hard_cap: 110

paths:
  artifact_dir: artifacts
  data_dir: artifacts/data
  checkpoint_dir: checkpoints
  report_dir: reports

models:
  student:
    name: Qwen/Qwen3-8B
    revision: b968826d9c46dd6066d109eabc6255188de91218
    tokenizer_revision: b968826d9c46dd6066d109eabc6255188de91218
  teacher:
    name: Qwen/Qwen3-14B
    revision: 40c069824f4251a91eefaf281ebe4c544efd3e18
    tokenizer_revision: 40c069824f4251a91eefaf281ebe4c544efd3e18
  vocab_size: 151936

data:
  source: huggingface
  dataset_name: open-r1/OpenR1-Math-220k
  dataset_subset: default
  dataset_split: train
  dataset_revision: e4e141ec9dea9f8326f4d347be56105859b2bd68
  input_path: null
  format: parquet
  allow_smaller: false
  counts:
    smoke: 128
    validation: 1000
    train: 15000

evaluation_data:
  math500:
    dataset_name: HuggingFaceH4/MATH-500
    dataset_subset: null
    split: test
    revision: 6e4ed1a2a79af7d8630a6b768ec859cb5af4d3be
  aime_2024:
    dataset_name: HuggingFaceH4/aime_2024
    dataset_subset: null
    split: train
    revision: 2fe88a2f1091d5048c0f36abc874fb997b3dd99a
  aime_2025:
    dataset_name: yentinglin/aime_2025
    dataset_subset: default
    split: train
    revision: 6f71d77b0b89b9dabe07ab466c51df33f514df7f

contamination:
  train_path: artifacts/data/curated/train.parquet
  eval_paths: []
  enable_near_duplicate: true
  jaccard_threshold: 0.8
  shingle_size: 5

rollout:
  backend: vllm
  split: train
  input_path: null
  batch_size: 16
  shard_size: 200
  tensor_parallel_size: 1
  dtype: bfloat16
  max_model_length: 4096
  gpu_memory_utilization: 0.9
  generation:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    max_new_tokens: 1536
    num_samples: 1

verification:
  prompt_path: null
  rollout_path: null

teacher:
  backend: transformers
  input_path: null
  top_k: 32
  dtype: bfloat16
  load_in_8bit: false
  max_length: 2048
  shard_size: 200

weighting:
  verifier:
    pass: 1.0
    unknown: 0.3
    fail: 0.0
  confidence:
    minimum: 0.1
    maximum: 1.0

training:
  backend: transformers
  method: weighted_opd
  input_path: artifacts/data/training_views/round_0/weighted_opd.parquet
  validation_path: artifacts/data/curated/validation.parquet
  output_dir: checkpoints/weighted_opd_seed42
  qlora: true
  dtype: bfloat16
  mixed_precision: bf16
  max_length: 2048
  batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  learning_rate: 0.00002
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_steps: 800
  warmup_steps: 40
  save_steps: 200
  resume_from_checkpoint: null
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  early_stopping:
    eval_steps: 200
    patience: 3
    min_delta: 0.005
    max_epochs_per_round: 1
    max_validation_samples: 200
    max_new_tokens: 512
    instruction_validation_path: eval/instruction_regression.jsonl
    max_instruction_validation_samples: 8
    instruction_max_new_tokens: 64
    weights:
      math_accuracy: 0.8
      format_pass_rate: 0.1
      instruction: 0.1

evaluation:
  backend: vllm
  model_name: Qwen/Qwen3-8B
  model_revision: b968826d9c46dd6066d109eabc6255188de91218
  tokenizer_revision: b968826d9c46dd6066d109eabc6255188de91218
  output_dir: artifacts/evaluation/base
  batch_size: 8
  tensor_parallel_size: 1
  generation:
    temperature: 0.0
    top_p: 1.0
    max_new_tokens: 2048
    num_samples: 1
  suites:
    regression:
      input_path: artifacts/data/curated/validation.parquet
      max_samples: 500
    math500:
      input_path: artifacts/data/eval/math500.parquet
      max_samples: 500

benchmark:
  registry_path: eval/registry.yaml
  launcher: vllm
  dtype: bfloat16
  max_model_length: 40960
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.9
  use_chat_template: true
  save_details: true
  tasks: [math500, aime2024, gpqa_diamond, ifeval]

report:
  output_dir: reports
  summary_paths: []
  comparison_paths: []
  training_runs: []
  runs: []

promotion:
  max_accuracy_regression: 0.0
  min_length_ratio: 0.7
  max_length_ratio: 1.3
  max_unknown_rate_increase: 0.02
  allow_unknown_git_commit: false

audit:
  sparse_kl:
    samples: 32
    vocab_size: 64
    top_k: 8
    learning_rate: 0.05
    teacher_logit_scale: 2.5
    student_noise: 1.0
