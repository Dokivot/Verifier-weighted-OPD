defaults: vfs_weighted_mvp.yaml

project:
  run_tier: resume-mvp-dense-vanilla

teacher:
  input_path: artifacts/resume_mvp/data/rollouts/round_0/rollouts.parquet
  output_dir: artifacts/resume_mvp/data/annotations/dense_vanilla_b100/round_0
  reuse_annotation_paths:
    - artifacts/resume_mvp/data/annotations/vfs_weighted_b50/round_0/teacher.parquet

training_view:
  annotation_path: artifacts/resume_mvp/data/annotations/dense_vanilla_b100/round_0/teacher.parquet
  selection_path: null
  output_name: dense_vanilla_b100

training:
  method: vanilla_opd
  max_records: null
  input_path: artifacts/resume_mvp/data/training_views/round_0/dense_vanilla_b100.parquet
  output_dir: artifacts/resume_mvp/checkpoints/dense_vanilla_b100_seed42
  max_steps: 375
  warmup_steps: 20
  save_steps: 125
  early_stopping:
    eval_steps: 375
    patience: 3

evaluation:
  output_dir: artifacts/resume_mvp/evaluation/dense_vanilla_b100
