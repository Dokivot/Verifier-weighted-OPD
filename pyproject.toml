[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opd-lab"
version = "0.1.0"
description = "Budget-aware verifier- and confidence-weighted on-policy distillation pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2.0",
  "pydantic>=2.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
data = [
  "datasets>=3.2",
  "pyarrow>=18.0",
]
gpu = [
  "accelerate>=1.2",
  "bitsandbytes>=0.45; platform_system == 'Linux'",
  "peft>=0.14",
  "torch>=2.5",
  "transformers>=4.48",
  "vllm==0.10.1.1; platform_system == 'Linux'",
]
eval = [
  "lighteval==0.9.2",
  "langdetect>=1.0.9",
  "math-verify>=0.7",
  "more-itertools>=10,<11",
]
tracking = ["wandb>=0.19"]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
]
all = [
  "accelerate>=1.2",
  "bitsandbytes>=0.45; platform_system == 'Linux'",
  "datasets>=3.2",
  "lighteval==0.9.2",
  "langdetect>=1.0.9",
  "math-verify>=0.7",
  "more-itertools>=10,<11",
  "mypy>=1.14",
  "peft>=0.14",
  "pyarrow>=18.0",
  "pytest>=8.3",
  "ruff>=0.9",
  "torch>=2.5",
  "transformers>=4.48",
  "vllm==0.10.1.1; platform_system == 'Linux'",
  "wandb>=0.19",
]

[project.scripts]
opd = "opd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
